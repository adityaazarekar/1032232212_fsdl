<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book REST API - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero {
            padding: 80px 0;
            color: white;
            text-align: center;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .card-link {
            text-decoration: none;
        }
        .action-card {
            border: none;
            border-radius: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .action-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .action-card .card-body {
            padding: 40px 30px;
            text-align: center;
        }
        .action-card .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .api-info {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            color: white;
        }
        .api-info code {
            color: #ffd700;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <h1>📚 Book REST API</h1>
            <p>A simple REST API built with Node.js and Express for managing books</p>

            <div class="row justify-content-center mt-5 g-4">
                <div class="col-md-4">
                    <a href="/new-book.html" class="card-link">
                        <div class="card action-card">
                            <div class="card-body">
                                <div class="icon">➕</div>
                                <h4 class="card-title">Add New Book</h4>
                                <p class="text-muted">Add a new book to the database using HTTP POST</p>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/book-list.html" class="card-link">
                        <div class="card action-card">
                            <div class="card-body">
                                <div class="icon">📖</div>
                                <h4 class="card-title">View All Books</h4>
                                <p class="text-muted">View all books from the database using HTTP GET</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>


        </div>
    </div>
</body>
</html>
